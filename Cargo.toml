[package]
name = "matcher"
version = "1.0.0"
edition = "2021"
default-run = "matcher"

[dependencies]
chrono = "0.4.45"
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
tonic = "0.12"
tonic-health = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.40", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "signal",
] }
tokio-stream = "0.1"
config = { version = "0.15.27", default-features = false, features = ["toml", "convert-case"] }
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }


[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }

[[bench]]
name = "orderbook"
harness = false

[[bench]]
name = "wal"
harness = false

[[bench]]
name = "engine"
harness = false


[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
# Treat warnings as errors or warnings
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Specific overrides & allowances
module_inception = "allow"
too_many_arguments = { level = "warn" }
must_use_candidate = "allow"
missing_errors_doc = "allow"
