[package]
name = "matcher"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.45"
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.40", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
] }
tokio-stream = "0.1"


[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
# Treat warnings as errors or warnings
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Specific overrides & allowances
module_inception = "allow"
too_many_arguments = { level = "warn" }
must_use_candidate = "allow"
missing_errors_doc = "allow"
